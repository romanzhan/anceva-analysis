name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check app tests

      - name: Format check
        run: ruff format --check app tests

      - name: Typecheck
        run: mypy app
        continue-on-error: true  # первое время — не блокируем

      - name: Test
        env:
          ENV: local
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          WEB_SESSION_SECRET: ci-secret
        run: pytest -q

      - name: Alembic — миграции применяются в чистую БД
        env:
          DATABASE_URL: "sqlite+aiosqlite:///./var/ci.sqlite"
        run: |
          mkdir -p var
          alembic upgrade head
