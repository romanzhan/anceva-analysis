[project]
name = "anceva-bot"
version = "0.1.0"
description = "Telegram-бот для Центра Коррекции Речи Марии Анцевой: консультация, запись, администрирование."
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "romanzhan" }]

dependencies = [
    # Telegram
    "aiogram>=3.15.0",
    "aiohttp>=3.10.0",

    # LLM
    "google-generativeai>=0.8.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",

    # Web
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.12",
    "itsdangerous>=2.2.0",

    # Config / validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",

    # Scheduling
    "apscheduler>=3.10.4",

    # Logging / observability
    "structlog>=24.4.0",
    "sentry-sdk>=2.18.0",

    # Time / misc
    "pytz>=2024.2",
    "orjson>=3.10.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "black>=24.10.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "aioresponses>=0.7.6",
    "freezegun>=1.5.0",
    "honcho>=2.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# -----------------------------------------------------------------------------
# Ruff
# -----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions", ".venv"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",          # pyflakes
    "I",          # isort
    "N",          # pep8-naming
    "UP",         # pyupgrade
    "B",          # flake8-bugbear
    "C4",         # comprehensions
    "SIM",        # simplify
    "RUF",        # ruff-specific
    "ASYNC",      # async pitfalls
    "S",          # bandit (security)
    "DTZ",        # datetime pitfalls
    "PL",         # pylint
    "PTH",        # use pathlib
]
ignore = [
    "E501",       # line too long (black handles)
    "PLR0913",    # too many args
    "PLR2004",    # magic values (часто мешает в dsl-коде)
    "S101",       # assert в тестах
    "RUF001",     # кириллица как неамбигиозные символы
    "RUF002",     # кириллица в docstrings
    "RUF003",     # кириллица в комментариях
    "N806",       # non-lowercase variable — иногда нужно
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "DTZ"]
"migrations/**" = ["E", "F", "I", "N"]
"app/db/models/**" = ["N815"]  # mixed case для SQL columns допустимы

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# -----------------------------------------------------------------------------
# Black
# -----------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py312"]
exclude = '''
/(
  \.venv
  | migrations/versions
)/
'''

# -----------------------------------------------------------------------------
# Mypy
# -----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/", "tests/"]

[[tool.mypy.overrides]]
module = ["google.generativeai.*", "apscheduler.*"]
ignore_missing_imports = true

# -----------------------------------------------------------------------------
# Pytest
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers --tb=short"
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["app/**/__init__.py", "app/**/main.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
