{% extends "base.html" %}
{% block title %}Чат · anceva.admin{% endblock %}

{% block content %}
<a href="/admin/inbox" class="text-sm text-gray-500 mb-2 inline-block">← к списку</a>
<h1 class="text-xl font-semibold mb-4">Диалог #{{ dialog_id }}</h1>

<div class="grid grid-cols-1 md:grid-cols-[1fr_280px] gap-4">
  <div class="card min-h-[400px]">
    <div class="text-xs text-gray-500 uppercase tracking-wide mb-3">Сообщения</div>
    {% if messages %}
      {% for m in messages %}<div class="mb-2">{{ m.content }}</div>{% endfor %}
    {% else %}
      <p class="text-sm text-gray-500">Сообщений пока нет.</p>
    {% endif %}
  </div>

  <aside class="card">
    <h3 class="font-semibold mb-2">Карточка</h3>
    <p class="text-sm text-gray-500">В разработке.</p>
    <button class="btn btn-primary mt-4 w-full">Взять диалог</button>
    <button class="btn btn-ghost mt-2 w-full">Карточка ребёнка</button>
  </aside>
</div>
{% endblock %}
