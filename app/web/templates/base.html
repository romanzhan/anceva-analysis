<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Anceva Admin{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
  <script src="https://unpkg.com/htmx.org@2.0.3" defer></script>
  <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌿%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --accent: #4f6cff;
      --accent-2: #3a52d6;
      --accent-soft: #eef0ff;
      --ink: #1b1f24;
      --ink-2: #434b55;
      --muted: #747d88;
      --line: #e4e7ec;
      --tint: #f6f8fb;
    }
    body { background: #f7f8fa; color: var(--ink); font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif; }
    .nav-link { padding: 6px 12px; border-radius: 6px; font-size: 14px; color: var(--ink-2); text-decoration: none; }
    .nav-link:hover { color: var(--accent-2); }
    .nav-link.active { background: var(--accent-soft); color: var(--accent-2); font-weight: 600; }
    .btn { padding: 8px 14px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; transition: background .15s; }
    .btn-primary { background: var(--accent); color: #fff; border: 1px solid var(--accent); }
    .btn-primary:hover { background: var(--accent-2); }
    .btn-ghost { background: #fff; color: var(--ink-2); border: 1px solid var(--line); }
    .btn-ghost:hover { background: var(--tint); }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px; }
    .kpi-card { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
    .kpi-card .n { font-size: 28px; font-weight: 700; letter-spacing: -.01em; }
    .kpi-card .l { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .12em; margin-top: 6px; }
  </style>
  {% block head %}{% endblock %}
</head>
<body class="min-h-screen">
  {% if admin %}
  <header class="bg-white border-b border-gray-200">
    <div class="max-w-[1400px] mx-auto px-4 h-14 flex items-center gap-3">
      <a href="/admin" class="font-bold text-[15px]" style="color: var(--accent-2)">anceva.admin</a>
      <nav class="flex items-center gap-1 flex-wrap ml-4">
        <a href="/admin" class="nav-link {% if active_nav=='dashboard' %}active{% endif %}">Dashboard</a>
        <a href="/admin/inbox" class="nav-link {% if active_nav=='inbox' %}active{% endif %}">Inbox</a>
        <a href="/admin/clients" class="nav-link {% if active_nav=='clients' %}active{% endif %}">Клиенты</a>
        <a href="/admin/schedule" class="nav-link {% if active_nav=='schedule' %}active{% endif %}">Расписание</a>
        <a href="/admin/payments" class="nav-link {% if active_nav=='payments' %}active{% endif %}">Оплаты</a>
        <a href="/admin/broadcasts" class="nav-link {% if active_nav=='broadcasts' %}active{% endif %}">Рассылки</a>
        <a href="/admin/templates" class="nav-link {% if active_nav=='templates' %}active{% endif %}">Шаблоны</a>
        <a href="/admin/settings" class="nav-link {% if active_nav=='settings' %}active{% endif %}">Настройки</a>
      </nav>
      <div class="ml-auto flex items-center gap-3 text-sm">
        <span class="text-gray-600">{{ admin.name }}</span>
        <a href="/auth/logout" class="text-gray-500 hover:text-gray-800">Выйти</a>
      </div>
    </div>
  </header>
  {% endif %}

  <main class="max-w-[1400px] mx-auto px-4 py-6">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
