# Fly.io deployment config.
# Установка Fly CLI и деплой — см. DEPLOY.md.

app = "anceva-bot"           # при fly launch будет предложено поменять, если занято
primary_region = "fra"       # Frankfurt — быстро до Казахстана; или waw, cdg

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  ENV = "production"
  LOG_FORMAT = "json"
  TZ = "Asia/Qyzylorda"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"    # бот не должен засыпать
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "30s"
  method = "GET"
  path = "/healthz"

[[mounts]]
  source = "anceva_data"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1

[processes]
  app = "sh -c 'alembic upgrade head && honcho start'"

[deploy]
  release_command = "alembic upgrade head"
